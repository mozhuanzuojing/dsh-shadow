name: publish

# 推 tag 即发布：用 npm Trusted Publishing（GitHub OIDC），不需要长期 token，
# 也不需要维护者手动 2FA（npm 侧的 "Trusted Publisher" 指向本仓库 + 本文件名）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC：npm CLI 自动交换短时发布凭证
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 发版门要校验 tag 指向 HEAD，需要完整 tag 引用
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # 发布构建禁用缓存
      - run: npm ci
      - run: npm run verify
      - run: npm run release # 发版门：版本三处一致 + pack 白名单 + tag 指向 HEAD
      - run: npm publish # OIDC 自动认证；公共仓库 + 公共包时自动生成 provenance
