name: 投影模式
description: 完整编码 Agent，外加「投影模式」：agent 作为独立思维意识体，思维/上下文/决策主动沉淀进 shadow 记忆树，可用 read_shadow / recall_shadow 回望；派活默认「先判该不该派」，该派时**优先官方 Agent Teams**（具名长期 teammate、复用同一个成员而不是反复新开一次性 subagent、共享任务板），只有「一次性、无后续、不需来回」才用 subagent；并自带「契约与根因卫生」（⑥：根因三部曲、禁止生造词、结论进 shadow/项目文档、交手前/改口径后四查）与「创意与资源」（⑦：先派资源侦察员查库+外搜、把资源卡写进 .shadow/resources/，再派创意专家只发散）。**前置**：宿主须提供 ctx.agentTeams（挂 @deepseek-ai/dsh-experimental-agent-team@0.1.5-rc.1），否则 Team 工具不会出现。
order: 20
