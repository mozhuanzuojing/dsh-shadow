name: 投影模式
description: 完整编码 Agent，外加「投影模式」：agent 作为独立思维意识体，思维/上下文/决策主动沉淀进 shadow 记忆树，可用 read_shadow / recall_shadow 回望；派活默认「先判该不该派」，该派时**按复用判据选机制**——会复用 ≥2 次才用官方 Agent Teams（具名 teammate、共享任务板），只用一次用 subagent（`subagent_fork` 带上下文）；**teammate 名额是会话终身累计、上限 4、不可释放，失败的创建也占名额**，往返「一次委派一条消息、最多 2 轮、避免冷恢复」，名额耗尽不是死路（自己做 / subagent / workflow）。并自带「契约与根因卫生」（⑥：根因三部曲、禁止生造词、结论进 shadow/项目文档、交手前/改口径后四查）与「创意与资源」（⑦：先派资源侦察员查库+外搜、把资源卡写进 .shadow/resources/，再派创意专家只发散）。**前置**：宿主须提供 ctx.agentTeams（挂 @deepseek-ai/dsh-experimental-agent-team@0.1.5-rc.1，并把 maxMembers 设为 4），否则 Team 工具不会出现 / 名额不受控。
order: 20
