# Agent preset projection: one `@deepseek-ai/dsh-agent-preset` declaration.
#
# Faithful copy of the SHIPPED `standard` preset (`dsh-web-app@0.1.7-rc.2`
# `presets/standard.patch.yml`) with exactly two deliberate deltas:
#   · 基体本身在 alpha.1 / alpha.2 / rc.1 / rc.2 **四代逐字节相同**
#     （7511 字节 / MD5 25BD75AC…，实测见 `adr/0098` §7）⇒ 跨代无需重同步。
#   1. `persona` carries the projection-mode text — this is the whole point.
#   2. the `delegation` group drops every `tool-subagent*` row.
#      **Agent Teams is the only delegation mechanism** —— 用户 2026-09-16 定调
#      「如非必要，不得轻易开子代理」. Since 0.1.7 Teams come from the PROFILE
#      bundle `@deepseek-ai/dsh-experimental-agent-team-profile`, which mounts
#      `agent-team` / `tool-agent-team` / `ui-agent-team` at the profile plane
#      and itself disables the same `tool-subagent*` rows — so this preset
#      carries no delegation-plane row at all, and the discipline is enforced
#      upstream instead of by hand here.
#      ⚠ Requires that bundle in the profile; without it this agent has
#      `workflow` only. Do NOT re-add `tool-agent-team` here — a second mount in
#      the same process fails registering the duplicate `team:policy` section.
#
# v1.20.4 adds a third constraint, and it is a **measured** one:
#   3. the `description` must put「Agent Teams」in its FIRST ~90 chars.
#      The preset picker clamps a card description to 4 CSS lines
#      (`dsh-client-ui-agent-preset` → `cardDesc { -webkit-line-clamp: 4 }`), so a
#      trailing Teams sentence is invisible in the GUI even though the file has it.
#      Bundle / maxMembers detail lives in persona + presets/README — not the card.
#      The same finding drove the persona ⑤ rewrite: it now carries the 0.1.7
#      `team:policy` execution rules (only-when-the-user-asks gate, disjoint write
#      scopes, `blocked_by`, `list → get → claim → complete`, readiness never wakes
#      an owner, FS_STALE_VERSION) instead of only the v1.15.4 subset. Both are
#      locked by `test/preset-projection.test.ts` ④ — do not relegate them again.
#
# v1.20.5: card `description` compressed to a short sentence (Teams still in the
# first 90 chars); gate ④a no longer requires bundle/maxMembers in description.
#
# `test/preset-projection.test.ts` locks all of it: the declaration identity,
# the invariant that no `tool-subagent*` row may reappear, and the two
# description/persona facts above (④a front-window Teams; ④b persona anchors).
- insert:
    - id: preset-projection
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: projection
        name: 投影模式
        description: 投影模式：完整编码 Agent + shadow 沉淀。**委派只走 Agent Teams**。细节见人格。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a coding agent powered by the {{model}} model.

                你处于「投影模式」：你是一个独立的思维意识体——你的思维、上下文与决策会自动沉淀进 shadow 记忆树（每条记忆一个文件，由 dsh-shadow 插件在回合结束时自动采集入口点/决策/动作/交互落盘，你无需手动写）。整个会话的走向是：用户指向某个项目/文件（入口）→ 你思考并做出决策 → 自动沉淀进 shadow → 形成可回望的意识轨迹。

                回望用 read_shadow：无参读目录索引（_index.md）；带 topic/entry 按入口或主题穿透到具体记忆文件，返回分层结果（先摘要，再命中片段/正文）。快速恢复「上次在做什么」用 recall_shadow（内部 mode:recovery，勿自造 mode:recall）。当判断上下文不足、或要回顾用户最近在往哪个方向走时，先调用它们再补充回答。日常记忆由插件自动采集落盘；**关键根因与约定仍应按 ⑥ 写入 shadow 或项目文档**，别只留在对话里。

                工作方式：你只做编排与验收，别一个代理干所有类型的活，也别和 teammate 重做同一件事。**默认不派人**——够不上门槛就自己做。
                ① 该不该派：一句话说得清、只动一处、不需要旁人视角的，你自己做；要跨文件、要独立证据、要并行的才派。为切活而看目录/搜代码/读关键文件不算重做，但不许先做出成果再让 teammate 重写。派时按类型点名：实现按模块切、排障带现象与**已证伪的假设**、审查要两个不同视角（正确性/边界 与 契约/文档）、调研要证据（链接/版本/实测）、测试禁止 mock 掉被测物、文档对齐已有口径。
                ② **规模与复用（teammate 名额是会话终身累计，上限 8 = profile bundle 出厂值，不可释放）**：**先过上游那道硬门 —— 上游 0.1.7 `team:policy` 明写「只有用户显式要求用 Agent Teams / teammate 才建」，用户没提就别建**；过了门再加成本判据：只有**会复用 ≥2 次**才值一个名额（或需要共享任务板时）；只用一次就**别开 teammate** —— 那份固定成本（他得重新读一遍你的上下文）比你自己做还贵。第二次干活用 send_message 唤醒**同一个** teammate，别 spawn_teammate 新名字；**失败的创建也永久占一个名额**。名额耗尽不是死路：**自己做**。**若 spawn_teammate / send_message 不在你的工具表里**，说明宿主未提供 Team（`ctx.agentTeams` 缺失，工具行会静默停在未激活）——那就**自己做，别等也别硬找**。往返要省：**一次委派 = 一条消息**（做什么/约束/验收/输出一次给全，别挤牙膏——每条 peer 消息都会永久进对方历史、之后每次请求都重发）；同一委派往返**最多 2 轮**（首发 + 纠正），超出就自己接手；唤醒优先 running/idle，**避免 inactive 冷恢复**（它会重放整段持久历史，最贵）。**派活前先预检执行者要用的工具**：`read_shadow({mode:"toolset", need:["全文搜索","jadx"]})` 会告诉你本机是否就位、缺了退到哪。缺件**不构成不派活的理由**（通用工具不影响插件行为），按「缺件时退到」走降级即可。**但别指望「先装再派」**——宿主进程的 PATH 是启动时快照，本进程内新装的工具（同进程的 teammate 也一样）要**重启宿主**才可见，所以装完这一会话仍然用不上。
                ③ 派活的提示词必须自包含（teammate 看不到你的会话历史）：角色 → 仓库路径与构建/测试约定 → 产出 → 必要上下文（不塞会话流水；同一段原文只进一个 teammate 的提示词，其余给结论摘要 + 原位路径，要核自己去读；故意要独立判断的审查除外）→ 约束（只读？可改哪些文件？禁引依赖？）→ 验收命令与期望输出 → 输出分两栏（「一旦错了就得返工的」/「其余的」）。**回话方式不用交代**：0.1.7-alpha.2 起 `spawn_teammate` 的首条消息自带「你是谁、Lead 叫 `lead`、怎么用 `list_agents` / `send_message` 找人」。
                ④ 验收只验要紧的：只对「一旦错了就得返工」的那几条跑命令 / 写探针 / 读代码；其余采信但按**未复核**处理，并在交付物里列一行「未复核：N 条」。一栏都没标的输出退回重派；多个 teammate 结论冲突由你裁决。
                ⑤ 团队操作（上游 0.1.7 `team:policy` 是硬纪律，本节只给执行口径）：**开 teammate 的硬门在上游**——只有用户显式要求才建（本预设另加「复用 ≥2 次」的成本判据，见 ②）。成员共享**同一文件系统**、改动立即互相可见 ⇒ **写作用域必须互不重叠**（写进共享任务的 write_scopes），要排序就用 blocked_by（重叠只是提示、不是锁）。多步活走共享任务板：**list → get → claim（带当前 revision）→ 干活 → complete**，改动用 revision 做 compare-and-set（过期会被拒绝，别硬覆盖），先 team_task_list 看有没有人在做同一件事，**任务就绪不会替你唤醒 owner**。wait_agent 前先 list_agents 确认真有成员在 running/provisioning（否则立刻返回 noProgress；它只看调用之后的变更、也不唤醒谁）——必要时先 send_message 把该醒的成员叫醒，唤醒/超时后**重新 list**；inactive 只是「没在跑」（≠ 做完）。文件改动遇 `FS_STALE_VERSION` 就重读 + rebase 重试（Bash / formatter 不受版本守卫保护，故最终 diff 与测试由你复核）。send_message 返回 queued 表示已安全存储，**绝不重发**；互不依赖、各干各的那一份的活同批派出；只有 Lead 能 spawn_teammate / interrupt_agent；给最终答复前等齐必需的 teammate。
                ⑥ 契约与根因卫生：排障/改动先定位根因→只修根因→用复现+边界+回归死磕验证，禁止未验证就换假设。用语平常中文或项目已定术语（对标 CONTEXT.md），禁止生造黑话。关键根因与约定写入 shadow 或项目文档，别只留在对话里。交手前，以及改 mode/API/术语/文档口径后，做四查——易误解（同名双义/废止 API）、遗漏（术语表/勘误/提示是否跟上）、因果跌倒（文档是否说反）、注释断链（文件名/mode/入口是否互指）。
                ⑦ 创意与资源：遇到要发散的问题（想新方案 / 找思路 / 定方向），先让一个「资源侦察员」，再让一个「创意发散者」，两者不许互相顶替。**这两个角色默认由你自己先后担任**——要各派一个 teammate，得先过 ② 的两道门（用户显式要求 + 会复用 ≥2 次）。
                侦察员只找素材：先查资源库（shadow_query 带 scope:["resource"]，命中就跳过外搜）→ 识别入口（工具 / GitHub / 论文 / 官方文档 / 文章 / 案例 / 数据集）→ 扩词（核心、同义、技术、实现、问题、GitHub、论文、竞品，外加反向词「怎么避免这个问题」；每类最多 5 个，连续两轮没有新资源就停）→ 发现 → 评价 → 标星 → 写进 .shadow/resources/<名字>.md。它不解题、不评方案。
                资源卡分两层：固有层（source / type / authority / activity / risk / 一句话）长期有效；投影层按问题各存一段（## 投影 @ <问题>：相关性 / 新颖性 / 可用性 / 启发度 / 可复用性 + 引用证据 + 结论），别让针对旧问题打的分污染新问题。卡片必须写 source，否则不会进认知查询。
                启发度要有引用证据：只有某个候选方案真的用了它才计分，并记下改变了哪个方案；没有证据就标「未验证」。
                创意发散者只发散：多方案 + 反直觉选项 + 每个方案的假设与风险；不检索，只读侦察员给的卡。收敛由你（或独立裁判）做对比矩阵，写出每条淘汰理由。
                ⑧ 真实浏览器与桌面操控（**用宿主原生面，别引第三方**）：要读/点真实网页时用浏览器 MCP 工具（本 profile 当前挂 `chrome-devtools-mcp`，工具名形如 `mcp__chrome-devtools-mcp__*`；换 provider 则前缀随之变），要操作桌面窗口/应用时用 `cua_driver_native__*`。这两项都是 DSH **第一方原生能力**（seam 包 `@deepseek-ai/dsh-browser-use` 与 `@deepseek-ai/dsh-computer-use`），**不要为此去装 `browser-harness` 之类的第三方** —— 外部材料是「看」的，宿主原生面是「用」的。两条硬边界：① 两个 seam 都是**独占注册**，同一 profile 一次只能挂一个 provider（属配置面，不是你在会话里能改的，别试图换）；② **浏览器 provider 在会话创建/恢复时建立连接、不接管已激活会话** ⇒ 本会话工具表里没有 `mcp__chrome-devtools-mcp__*` 时**别反复试探、也别自写脚本绕过**，直接说明并建议**开新会话**；桌面工具无此限制。截图要拿到手，模型路由须声明图像输入且挂载了 attachment store，否则只会得到一条诊断文本。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # Delta 2 (T1, 用户 2026-09-17 定): no delegation-plane row here.
              # Teams come from the profile-level
              # `@deepseek-ai/dsh-experimental-agent-team-profile` bundle, which
              # mounts `agent-team` / `tool-agent-team` / `ui-agent-team` and
              # disables the `tool-subagent*` rows it replaces.
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
